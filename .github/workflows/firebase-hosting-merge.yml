name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned: 22.23.0 regressed the service-account token lookup
          # ("Premature close" in undici) and broke the sibling projects' deploy.
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISSUES_LATAM_TOOLS }}
          channelId: live
          projectId: issues-latam-tools
          # Pinned: firebase-tools 15.22.2 regressed service-account
          # authentication. The same pin the simulator already carries.
          firebaseToolsVersion: "15.22.1"

# The Firestore rules and indexes do NOT ship from here -- deploying them is
# manual (`firebase deploy --only firestore`). That way the CI credential needs
# no write permission on the database, and a rule regression cannot hitch a ride
# on a routine push.
